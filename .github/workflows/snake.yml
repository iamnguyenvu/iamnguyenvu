name: Generate Snake
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialize writes with the day/night workflow to avoid simultaneous pushes.
concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: iamnguyenvu
          outputs: |
            assets/activity/snake-dark.svg?color_snake=%23ffa657&color_dots=%23161b22,%231c354d,%23275275,%235184b1,%23a5d6ff
            assets/activity/snake-light.svg?color_snake=%23953800&color_dots=%23ebedf0,%23d6e6f7,%239dc2e8,%235d94cc,%230550ae
      - name: Commit changed snake artwork
        run: |
          git add assets/activity/snake-dark.svg assets/activity/snake-light.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update contribution snake [skip ci]'
          git push
